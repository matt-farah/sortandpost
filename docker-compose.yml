services:
  app:
    build: .
    image: sortandpost:local
    ports:
      # Localhost only: there's no login yet (Docker.md). Set BIND=0.0.0.0 to reach
      # it from other devices on a network you trust.
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_DATA: /data
      PORT: 8080
      CLIP_MODEL: ${CLIP_MODEL:-}
      # Shown in messages instead of /data/sync (e.g. "keep <folder> downloaded").
      SORTANDPOST_HOST_SYNC_DIR: ${SYNC_DIR}
    volumes:
      # Photo library: read-write so the metadata engine can write EXIF/XMP.
      # Nothing else in the app writes under this path.
      - "${PHOTO_LIBRARY:?set PHOTO_LIBRARY in .env}:/library:rw"
      # More photo folders: add a line per folder, mounting to /library/1,
      # /library/2, ... then register it in the app's Settings page, e.g.
      #   - "/Users/you/CloudStorage/Scans:/library/1:rw"
      # The shared library folder (sync/): what your sync tool / NAS share carries
      # between computers. The desktop apps pick this same folder.
      - "${SYNC_DIR:?set SYNC_DIR in .env}:/data/sync:rw"
      # This container's own data (working DB, device id, app trash). Never put it
      # in a synced folder -- sync tools corrupt a SQLite file written in place.
      # A Docker volume by default; set LOCAL_DIR to a host folder to see it.
      - "${LOCAL_DIR:-sortandpost-local}:/data/local:rw"
    # The name other computers see ("read-only · <name>", "Take over editing").
    hostname: "${DEVICE_NAME:-sortandpost-docker}"
    restart: unless-stopped
    # File-manager "Reveal in Finder/Explorer" needs a small host agent that runs
    # OUTSIDE Docker (the container has no host GUI). See tools/sortandpost_helper.py:
    #   python3 tools/sortandpost_helper.py --app-data <a host folder holding local/>
    # (it writes local/helper.json, so it needs LOCAL_DIR set to a host folder).

  # One-shot indexer pass. Runs the same image with a different entrypoint.
  #   docker compose run --rm indexer --once
  indexer:
    build: .
    image: sortandpost:local
    profiles: ["tools"]
    environment:
      APP_DATA: /data
    volumes:
      - "${PHOTO_LIBRARY:?set PHOTO_LIBRARY in .env}:/library:rw"
      - "${SYNC_DIR:?set SYNC_DIR in .env}:/data/sync:rw"
      - "${LOCAL_DIR:-sortandpost-local}:/data/local:rw"
    hostname: "${DEVICE_NAME:-sortandpost-docker}"
    entrypoint: ["python", "-m", "sortandpost.indexer"]

volumes:
  sortandpost-local:
